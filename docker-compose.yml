services:
  postgres:
    image: postgres:18-alpine
    container_name: formo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-formo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - formo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-formo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: formo-mailpit
    profiles: ["dev", "test"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  formo_pgdata:
